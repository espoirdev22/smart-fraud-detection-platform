services:
  db:
    image: postgres:16-alpine
    container_name: fraud-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: fraud-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MODEL_PATH: ${MODEL_PATH}
      SECRET_KEY: ${SECRET_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-salou@fraudguard.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/ml_models:ro
      - ./ml/mlruns.db:/app/mlflow/mlruns.db:ro

  frontend:
    build:
      context: ./frontend
    container_name: fraud-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: fraud-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  db_data:
  grafana_data: